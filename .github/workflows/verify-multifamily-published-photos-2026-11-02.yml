name: Verify all family photos are live and byte-identical on GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-multifamily-published-photos-2026-11-02.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  live-photo-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify the exact published website photo bytes and license records
        run: |
          python3 - <<'PY'
          import concurrent.futures,hashlib,json,time,urllib.request,urllib.error
          from pathlib import Path
          site=Path("site")
          meta=json.loads((site/"data/collection-meta.json").read_text())
          catalog=json.loads((site/"data/collection-index.json").read_text())
          gal=json.loads((site/"data/gallery-index.json").read_text())
          base="https://crking92.github.io/"+meta["repository_full_name"].split("/")[-1]+"/site/"
          def retrieve(rel,cache=""):
              url=base+rel+cache
              req=urllib.request.Request(url,headers={"User-Agent":"HaysBotanyLiveOriginalPhotoAudit/1.0"})
              with urllib.request.urlopen(req,timeout=23) as response:
                  if response.status!=200: raise ValueError("Bad live HTTP status: "+url)
                  return response.read()
          expected=(site/"data/gallery-index.json").read_bytes()
          for retry in range(36):
              try:
                  current=retrieve("data/gallery-index.json","?release="+str(retry))
                  if current==expected:
                      print("PUBLIC_GALLERY_INDEX_CURRENT")
                      break
              except Exception as exc: print("Live Pages gallery not yet ready",repr(exc))
              time.sleep(10)
          else: raise SystemExit("Public Pages gallery never matched current GitHub index")
          paths={"data/collection-index.json","data/gallery-index.json","data/collection-meta.json"}
          total=0;represented=0
          for row in catalog["entries"]:
              sid=row["id"]
              path="data/species/"+sid+".json"
              paths.add(path)
              card=json.loads((site/path).read_text())
              images=card.get("verified_photos",[])
              if len(images)!=row["photo_count"] or len(images)!=gal["entries"][sid]["count"]:
                  raise SystemExit("Gallery card and index disagree: "+sid)
              total+=len(images)
              represented+=bool(images)
              for x in images:
                  rel=x["src"]
                  if not rel.startswith("media/"+sid+"/") or rel in paths:raise SystemExit("Missing/bad image URL "+rel)
                  if not x.get("creator") or not x.get("source_page") or not x.get("license_url"):
                      raise SystemExit("Credit missing "+rel)
                  if x.get("private_rights_review_only"):raise SystemExit("Held photo exposed "+rel)
                  nc=x.get("license") in ("CC BY-NC 4.0","CC BY-NC-SA 4.0")
                  if x.get("noncommercial_only") is not nc:raise SystemExit("NC usage flag mismatch "+rel)
                  if nc and meta.get("photo_license_policy",{}).get("noncommercial_educational_use") is not True:
                      raise SystemExit("Site does not qualify for NC "+rel)
                  paths.add(rel)
          if total!=gal["photo_count"] or represented!=gal["photo_species"]:
              raise SystemExit("Published photo totals inconsistent")
          def verify(rel):
              source=(site/rel).read_bytes()
              live=retrieve(rel)
              if hashlib.sha256(source).digest()!=hashlib.sha256(live).digest():
                  raise ValueError("Live photo or species bytes differ from GitHub: "+rel)
              return rel
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
              checked=list(pool.map(verify,sorted(paths)))
          print("LIVE_PUBLIC_GALLERY_IMAGE_PASS",json.dumps({
              "repository":meta["repository_full_name"],
              "site":base,"species":len(catalog["entries"]),
              "photos_visible":total,"photographed_species":represented,
              "exact_live_files_verified":len(checked)
          },sort_keys=True))
          PY
