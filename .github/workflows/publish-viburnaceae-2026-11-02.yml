name: Publish rights-verified Viburnaceae general photos
on:
  push:
    branches: [main]
    paths:
      - 'photo-intake/remote-photo-manifests/viburnaceae-2026-11-02.json'
      - 'scripts/verify_viburnaceae_photo_origins.py'
      - '.github/workflows/publish-viburnaceae-2026-11-02.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: trees-shrubs-approved-photo-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify photo-specific source licensing and original ZIP checksums
        run: |
          python3 scripts/verify_viburnaceae_photo_origins.py --manifest photo-intake/remote-photo-manifests/viburnaceae-2026-11-02.json --intake-root "$RUNNER_TEMP/viburnaceae-verified" --report "$RUNNER_TEMP/viburnaceae-checks.json"
      - name: Validate and install only cleared originals with original credits
        run: |
          python3 scripts/publish_approved_family_photos.py --source-root "$RUNNER_TEMP/viburnaceae-verified" --site-root site --check
          python3 scripts/publish_approved_family_photos.py --source-root "$RUNNER_TEMP/viburnaceae-verified" --site-root site
          python3 scripts/verify_automatic_gallery.py --site-root site
      - name: Commit validated image bytes and linked gallery records
        id: release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/media site/data/species site/data/gallery-index.json site/data/collection-index.json
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Publish credited Viburnaceae general photo ZIP batch"
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Trigger site rebuild after GitHub Actions publication
        if: steps.release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viburnaceae-exact-photo-rights-review
          path: ${{ runner.temp }}/viburnaceae-checks.json
          if-no-files-found: warn
          retention-days: 30
