name: Publish source-verified original multi-family ZIP photo batch
on:
  push:
    branches: [main]
    paths:
      - 'photo-intake/remote-photo-manifests/multifamily-salicaceae-to-tamaricaceae-2026-11-02.json'
      - 'scripts/publish_verified_multifamily_zip_batch.py'
      - '.github/workflows/publish-verified-multifamily-2026-11-02.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: family-photo-first-batch-release
  cancel-in-progress: false
jobs:
  publish-verified-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare photo source verifier
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify individual media reuse rights, source taxon and uploaded original ZIP SHA256
        run: |
          python3 scripts/publish_verified_multifamily_zip_batch.py \
            --manifest photo-intake/remote-photo-manifests/multifamily-salicaceae-to-tamaricaceae-2026-11-02.json \
            --source-root "$RUNNER_TEMP/cleared-photos" \
            --report "$RUNNER_TEMP/multifamily-photo-source-audit.json"
      - name: Install eligible originals only; preserve existing site photos
        run: |
          if test -f site/data/reviewed-external-photo-manifest.json; then
            python3 scripts/publish_approved_lamiales_photos.py --source-root "$RUNNER_TEMP/cleared-photos" --site-root site --check
            python3 scripts/publish_approved_lamiales_photos.py --source-root "$RUNNER_TEMP/cleared-photos" --site-root site
          else
            python3 scripts/publish_approved_family_photos.py --source-root "$RUNNER_TEMP/cleared-photos" --site-root site --check
            python3 scripts/publish_approved_family_photos.py --source-root "$RUNNER_TEMP/cleared-photos" --site-root site
            python3 scripts/verify_automatic_gallery.py --site-root site
          fi
          python3 scripts/build_collection_preview.py
      - name: Commit installed originals and individual photographer/license records
        id: update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/media site/data/species site/data/collection-index.json site/data/gallery-index.json
          if test -f site/data/reviewed-external-photo-manifest.json; then git add site/data/reviewed-external-photo-manifest.json; fi
          if git diff --cached --quiet; then
            echo "No additional photos qualified; source audit identifies holds."
          else
            git diff --cached --check
            git commit -m "Publish original licensed photos from Salicaceae–Tamaricaceae ZIP batch"
            git push origin HEAD:main
            echo "New photo bytes, gallery entries and credits committed."
          fi
      - name: Save actual photo-specific license/source/identity check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-multifamily-zip-photo-review
          path: ${{ runner.temp }}/multifamily-photo-source-audit.json
          retention-days: 30
          if-no-files-found: warn
