name: Auto-publish rights-cleared Trees & Shrubs photos
on:
  push:
    branches: [staging/original-source-transfer]
    paths: ['photo-intake/approved/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: trees-shrubs-approved-photo-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/original-source-transfer
          fetch-depth: 0
      - name: Check out current live family site independently
        run: |
          git fetch origin main
          git worktree add "$RUNNER_TEMP/family-release" origin/main
      - name: Validate image credits, license, identity and integrity
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 "$RUNNER_TEMP/family-release/scripts/publish_approved_family_photos.py" --source-root . --site-root "$RUNNER_TEMP/family-release/site" --check
      - name: Build verified updated gallery in isolated site copy
        run: python3 "$RUNNER_TEMP/family-release/scripts/publish_approved_family_photos.py" --source-root . --site-root "$RUNNER_TEMP/family-release/site"
      - name: Verify published site image integrity
        working-directory: ${{ runner.temp }}/family-release
        run: |
          python3 scripts/verify_automatic_gallery.py --site-root site
      - name: Commit only family website/gallery additions
        id: release
        working-directory: ${{ runner.temp }}/family-release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/media/ site/data/species/ site/data/gallery-index.json site/data/collection-index.json
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Auto-publish existing-species Trees & Shrubs approved photos"
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild GitHub Pages for bot-authored gallery commit
        if: steps.release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
