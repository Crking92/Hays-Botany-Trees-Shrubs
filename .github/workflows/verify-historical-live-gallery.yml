name: Verify actual public historical photo galleries
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-historical-live-gallery.yml'
      - 'workflow/multi-family-historical-archive-trust-2026-11-03.json'
      - 'workflow/multi-family-historical-ported-cc-2026-11-03.json'
      - 'workflow/multi-family-historical-public-domain-2026-11-03.json'
      - 'workflow/multi-family-historical-kew-synonyms-2026-11-03.json'
      - 'workflow/multi-family-species-card-reconciliation-2026-11-03.json'
      - 'workflow/multi-family-commons-direct-cc-recovery-2026-11-03.json'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  verify-live-website:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Crking92/Hays-Botany-Public
          ref: b5a983c92dff78a099b88abc24c2151f954ba40a
          path: .shared-photo-audit
          persist-credentials: false
      - name: Verify each photo and photographer on actual Pages
        run: |
          set -o pipefail
          python3 .shared-photo-audit/scripts/verify_historical_live_gallery.py --repository "Crking92/Hays-Botany-Trees-Shrubs" --site-root site | tee "$RUNNER_TEMP/hays-verified-photo-count.txt"
      - name: Record site-verified photo count on GitHub commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(awk '/^HAYS_HISTORICAL_SITE_PHOTOS_LIVE/ {print $2}' "$RUNNER_TEMP/hays-verified-photo-count.txt" | tail -n 1)
          test -n "$N"
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f context="hays-botany/historical-photos-live" -f description="$N historical photo bytes and creator/source credits verified on Pages"
