name: Verify existing Trees-Shrubs public gallery and site bytes
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_existing_site.py'
      - 'site/data/species/**'
      - 'site/data/gallery-index.json'
      - 'site/data/collection-index.json'
      - 'site/media/**'
      - '.github/workflows/verify-existing-site-gallery.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit existing public records and photo blob hashes
        run: python3 scripts/verify_existing_site.py
      - name: Wait until GitHub Pages has new gallery index
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          expected=json.loads(Path("site/data/gallery-index.json").read_text())
          url="https://crking92.github.io/Hays-Botany-Trees-Shrubs/site/data/gallery-index.json"
          for attempt in range(24):
              try:
                  req=urllib.request.Request(url+"?v="+str(attempt),headers={"User-Agent":"HaysBotany-PageReleaseCheck/1.0"})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      actual=json.load(response)
                  if actual.get("photo_count")==expected["photo_count"] and actual.get("photo_species")==expected["photo_species"]:
                      print("LIVE_GALLERY_COUNTS_MATCH",actual["photo_count"],actual["photo_species"])
                      break
              except Exception as exc:
                  print("Site index not yet available:",repr(exc))
              time.sleep(12)
          else:
              raise SystemExit("Live GitHub Pages gallery did not reach expected counts")
          PY
      - name: Verify published species JSON and gallery images
        run: python3 scripts/verify_existing_site.py --live https://crking92.github.io/Hays-Botany-Trees-Shrubs/site/

# Confirm all 801 optimized Trees-Shrubs images and photo source credits on public Pages.
