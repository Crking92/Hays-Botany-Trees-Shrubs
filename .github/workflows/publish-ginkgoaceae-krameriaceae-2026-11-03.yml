name: Publish cleared Ginkgoaceae-Krameriaceae Trees-Shrubs originals
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-ginkgoaceae-krameriaceae-2026-11-03.yml'
      - 'scripts/publish_verified_ginkgoaceae_krameriaceae_zip.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - run: python3 -m pip install Pillow==11.3.0
      - name: Check original source photos, then install and publish approved images
        run: |
          python3 scripts/publish_verified_ginkgoaceae_krameriaceae_zip.py --manifest photo-intake/remote-photo-manifests/ginkgoaceae-through-krameriaceae-2026-11-03.json --source-root "$RUNNER_TEMP/source-cleared" --report "$RUNNER_TEMP/source-audit.json"
          python3 scripts/publish_approved_family_photos.py --source-root "$RUNNER_TEMP/source-cleared" --site-root site --check
          python3 scripts/publish_approved_family_photos.py --source-root "$RUNNER_TEMP/source-cleared" --site-root site
          python3 scripts/verify_automatic_gallery.py --site-root site
      - name: Publish credited photo files and species gallery indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/media site/data/species site/data/collection-index.json site/data/gallery-index.json
          if ! git diff --cached --quiet; then git commit -m "Publish licensed Trees-Shrubs originals"; git push origin HEAD:main; fi
