name: Publish verified Leucobryaceae–Malpighiaceae original ZIP photos
on:
  push:
    branches: [main]
    paths:
      - 'photo-intake/remote-photo-manifests/leucobryaceae-through-malpighiaceae-2026-11-03.json'
      - 'scripts/publish_verified_leucobryaceae_malpighiaceae_zip.py'
      - '.github/workflows/publish-leucobryaceae-through-malpighiaceae-2026-11-03.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: spurges-mallows-source-verified-leucobryaceae-malpighiaceae-release
  cancel-in-progress: false
jobs:
  release-cleared-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install image validation dependency
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify exact photo-specific license, source observation taxon and original ZIP image hashes
        run: |
          python3 scripts/publish_verified_leucobryaceae_malpighiaceae_zip.py \
            --manifest photo-intake/remote-photo-manifests/leucobryaceae-through-malpighiaceae-2026-11-03.json \
            --source-root "$RUNNER_TEMP/source-cleared" \
            --report "$RUNNER_TEMP/leucobryaceae-malpighiaceae-source-audit.json"
      - name: Install source-cleared originals, individual credit and species gallery indexes
        run: |
          if test -f site/data/reviewed-external-photo-manifest.json; then
            python3 scripts/publish_approved_lamiales_photos.py --source-root "$RUNNER_TEMP/source-cleared" --site-root site --check
            python3 scripts/publish_approved_lamiales_photos.py --source-root "$RUNNER_TEMP/source-cleared" --site-root site
          else
            python3 scripts/publish_approved_family_photos.py --source-root "$RUNNER_TEMP/source-cleared" --site-root site --check
            python3 scripts/publish_approved_family_photos.py --source-root "$RUNNER_TEMP/source-cleared" --site-root site
            python3 scripts/verify_automatic_gallery.py --site-root site
          fi
          python3 scripts/build_collection_preview.py
      - name: Commit actual image bytes and credited site gallery records
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/media site/data/species site/data/collection-index.json site/data/gallery-index.json
          if test -f site/data/reviewed-external-photo-manifest.json; then git add site/data/reviewed-external-photo-manifest.json; fi
          if git diff --cached --quiet; then
            echo "No new eligible photos; inspect photo-specific source audit for holds."
          else
            git diff --cached --check
            git commit -m "Publish credited original Leucobryaceae–Malpighiaceae photos"
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then
                echo "Licensed photo release committed successfully."
                break
              fi
              if test "$attempt" -eq 4; then
                echo "Four non-force publication attempts exhausted" >&2
                exit 1
              fi
              # A concurrent family workflow may update gallery indexes. Apply approved
              # originals to the newest version instead of rebasing stale JSON indexes.
              git fetch origin main
              git reset --hard origin/main
              python3 scripts/publish_approved_family_photos.py --source-root "$RUNNER_TEMP/source-cleared" --site-root site --check
              python3 scripts/publish_approved_family_photos.py --source-root "$RUNNER_TEMP/source-cleared" --site-root site
              python3 scripts/verify_automatic_gallery.py --site-root site
              python3 scripts/build_collection_preview.py
              git add site/media site/data/species site/data/collection-index.json site/data/gallery-index.json
              if git diff --cached --quiet; then
                echo "All cleared originals already present after concurrent gallery update"
                exit 0
              fi
              git diff --cached --check
              git commit -m "Reapply Leucobryaceae–Malpighiaceae originals over latest verified family gallery"
            done
          fi
      - name: Preserve individual source-rights and hold audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leucobryaceae-malpighiaceae-source-audit
          path: "${{ runner.temp }}/leucobryaceae-malpighiaceae-source-audit.json"
          retention-days: 30
          if-no-files-found: warn
