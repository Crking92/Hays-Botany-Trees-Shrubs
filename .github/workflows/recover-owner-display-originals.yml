name: Recover exact owner-created Glass Root Garden historical photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-owner-display-originals.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: trees-shrubs-approved-photo-release
  cancel-in-progress: false
jobs:
  audit-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out assigned public family website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh current family gallery after other publication commits
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Worktree checkout of preserved historical source archive
        run: |
          git fetch origin staging/original-source-transfer
          git worktree add "$RUNNER_TEMP/source-archive" origin/staging/original-source-transfer
      - name: Check out SINGLE shared historical photo recovery implementation at pinned commit
        uses: actions/checkout@v4
        with:
          repository: Crking92/Hays-Botany-Public
          ref: 92c323fbd9f8fa33e3e46a1dcc200ca7700b7b34
          path: .shared-photo-audit
          persist-credentials: false
      - name: Install image decoder
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Audit up to 55 previously held originals and publish passing photos to this family only
        run: |
          python3 .shared-photo-audit/scripts/recover_owner_display_originals.py \
            --source-root "$RUNNER_TEMP/source-archive" \
            --site-root site \
            --repository "Crking92/Hays-Botany-Trees-Shrubs" \
            --publisher family \
            --limit 15
      - name: Verify the exact newly installed source bytes, credits and gallery links before commit
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("site")
          report=json.loads(Path("workflow/multi-family-owner-display-recovery-2026-11-03.json").read_text())
          gal=json.loads((root/"data/gallery-index.json").read_text())
          index=json.loads((root/"data/collection-index.json").read_text())
          assert gal["species"]==len(index["entries"])
          assert gal["photo_count"]>=report["new_installed"]
          seen=set()
          for row in report["records"]:
              if row["status"]!="SOURCE_VERIFIED_READY":continue
              sid=row["species_id"];relative=row["src"]
              assert relative.startswith("media/"+sid+"/")
              assert relative not in seen
              seen.add(relative)
              raw=(root/relative).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==row["sha256"],relative
              card=json.loads((root/"data/species"/(sid+".json")).read_text())
              matches=[p for p in card.get("verified_photos",[]) if p.get("src")==relative]
              assert len(matches)==1,(sid,relative)
              p=matches[0]
              assert p["creator"]==row["creator"] and p["source_page"]==row["source_page"] and p["license"]==row["license"]
              assert not p.get("private_rights_review_only") and not p.get("license","").endswith("-ND 4.0")
              if "NC" in p["license"]:
                  assert p["noncommercial_only"] is True
          assert len(seen)==report["new_installed"],(len(seen),report["new_installed"])
          print("HAYS_MULTIFAMILY_LOCAL_VERIFIED",len(seen),gal["photo_count"])
          PY
      - name: Commit only verified gallery assets and the holds/duplicates audit result
        id: save
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/media site/data/species site/data/gallery-index.json site/data/collection-index.json  workflow/multi-family-owner-display-recovery-2026-11-03.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^site/'; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          git commit -m "Publish verified Glass Root Garden archived originals under site-display permission"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Request public Pages build for newly installed images
        if: steps.save.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
      - name: Verify exact public oak photos and credits without requiring a frozen gallery index
        if: steps.save.outcome == 'success'
        run: |
          python3 - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          root=Path("site")
          base="https://crking92.github.io/Hays-Botany-Trees-Shrubs/site/"
          report=json.loads(Path("workflow/multi-family-owner-display-recovery-2026-11-03.json").read_text())
          previous=list(report.get("previous_batches") or [])+[report]
          photos={}
          for batch in previous:
              for row in batch.get("records") or []:
                  if row.get("status")=="SOURCE_VERIFIED_READY" and row.get("creator")=="Glass Root Garden" and row.get("license")=="OWNER PUBLIC DISPLAY PERMISSION":
                      photos[row["src"]]=row
          rows=list(photos.values())
          assert len(rows)==3,[(r["species_id"],r["src"]) for r in rows]
          def fetch(relative):
              request=urllib.request.Request(base+relative,headers={"User-Agent":"HaysBotanyExactOwnerImageVerifier/1.0"})
              with urllib.request.urlopen(request,timeout=25) as response:
                  assert response.status==200
                  return response.read()
          for row in rows:
              rel=row["src"];sid=row["species_id"]
              assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==row["sha256"]
              card=json.loads((root/"data/species"/(sid+".json")).read_text())
              assert any(p.get("src")==rel and p.get("creator")==row["creator"] and
                         p.get("source_page")==row["source_page"] and p.get("license")==row["license"] and
                         p.get("site_display_only") is True
                         for p in card.get("verified_photos",[])),sid
          for attempt in range(55):
              try:
                  for row in rows:
                      rel=row["src"];sid=row["species_id"]
                      assert hashlib.sha256(fetch(rel)).hexdigest()==row["sha256"],rel
                      card=json.loads(fetch("data/species/"+sid+".json"))
                      assert any(p.get("src")==rel and p.get("creator")==row["creator"] and
                                 p.get("source_page")==row["source_page"] and p.get("license")==row["license"] and
                                 p.get("site_display_only") is True
                                 for p in card.get("verified_photos",[])),(sid,rel)
                  break
              except Exception as ex:
                  if attempt==54:raise
                  print("Oak photo delivery pending",str(ex)[:160],flush=True)
                  time.sleep(8)
          print("MULTIFAMILY_PUBLIC_PHOTOS_LIVE_WITH_CREDITS",len(rows))
          PY
