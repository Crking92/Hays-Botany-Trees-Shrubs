name: Validate Hays Botany collection (never deploy)
on:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'data/**'
      - 'content/**'
      - 'scripts/validate_collection.py'
      - '.github/workflows/collection-validation.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out collection only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify family routing, IDs and staging authority
        run: python3 scripts/validate_collection.py
